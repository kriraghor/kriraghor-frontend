name: gym
on:
  push:
    branches: [main]
    paths: ["apps/gym/**", "packages/**", "package.json", "package-lock.json", ".github/workflows/gym.yml"]
  pull_request:
    paths: ["apps/gym/**", "packages/**", "package.json", "package-lock.json", ".github/workflows/gym.yml"]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: kriraghor/kriraghor-infrastructure/.github/workflows/nextjs-app.yml@main
    with:
      image: kriraghor-gym
      app-dir: apps/gym
      workspaces: true
      values-files: values/gym/staging.yaml
    secrets: inherit
